server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: memora

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:memora_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# SpringDoc OpenAPI & Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: ${SWAGGER_ENABLED:true}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
  dimensions: ${GEMINI_EMBEDDING_DIMENSIONS:768}
  batch-size: ${GEMINI_EMBEDDING_BATCH_SIZE:50}

app:
  storage:
    path: ${STORAGE_PATH:./uploads}
  current-user-id: ${DEFAULT_USER_ID:00000000-0000-0000-0000-000000000001}
  upload:
    max-file-size-bytes: 26214400 # 25MB
    allowed-content-types:
      - image/png
      - image/jpeg
      - image/webp
      - application/pdf
  jobs:
    poll-interval-ms: ${JOB_POLL_INTERVAL_MS:2000}
    retention-days: ${JOB_CLEANUP_RETENTION_DAYS:7}
    cleanup-cron: ${JOB_CLEANUP_CRON:0 0 2 * * ?}
  chunking:
    max-words: ${CHUNKING_MAX_WORDS:300}
    overlap-words: ${CHUNKING_OVERLAP_WORDS:40}

search:
  min-similarity: ${SEARCH_MIN_SIMILARITY:0.6}

logging:
  level:
    com.mmtq.memora.search: DEBUG
