spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:memora_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

gemini:
  api-key: test-key
  model: gemini-embedding-001
  dimensions: 768
  batch-size: 50

app:
  storage:
    path: ./test-uploads
  current-user-id: 00000000-0000-0000-0000-000000000001
  upload:
    max-file-size-bytes: 26214400
  jobs:
    poll-interval-ms: 600000
    retention-days: 7
    cleanup-cron: "0 0 2 * * ?"
  chunking:
    max-words: 300
    overlap-words: 40

search:
  min-similarity: 0.6
