services:
  memora-db:
    image: postgres:16-alpine
    container_name: memora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-memora_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgrespassword}
    ports:
      - "${DB_PORT:-5435}:5432"
    volumes:
      - memora_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-memora_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  memora_db_data:
